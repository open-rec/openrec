name: Cluster E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '41 17 * * 6'

permissions:
  contents: read

concurrency:
  group: cluster-e2e
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMPOSE_PARALLEL_LIMIT: '2'
      MAVEN_OPTS: -Xms128m -Xmx768m
      ZOOKEEPER_HEAP: '256'
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      SPARK_WORKER_MEMORY: 1g
      SPARK_DAEMON_MEMORY: 384m
      FLINK_JOBMANAGER_MEMORY: 768m
      FLINK_TASKMANAGER_MEMORY: 1024m
      FLINK_TASK_SLOTS: '1'
      HBASE_MASTER_HEAPSIZE: 512m
      HBASE_REGIONSERVER_HEAPSIZE: 768m
      HIVE_METASTORE_HEAP: -Xmx512m
      HIVESERVER2_HEAP: -Xmx768m
      ELASTIC_HEAP: -Xms1g -Xmx1g
      OPENREC_SPARK_TOTAL_EXECUTOR_CORES: '2'
    steps:
      - name: Reclaim hosted runner disk space
        run: |
          echo "Resources before cleanup"
          free -h
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          echo "Resources after cleanup"
          free -h
          df -h /

      - name: Check out distribution
        uses: actions/checkout@v7
        with:
          path: openrec/example
          clean: true

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Check out manifest components
        working-directory: openrec/example
        run: ./scripts/checkout-components.sh

      - name: Start and verify the complete cluster distribution
        working-directory: openrec
        run: ./example/example_cluster/start.sh

      - name: Capture diagnostics
        if: failure()
        working-directory: openrec
        run: |
          mkdir -p example/example_cluster/.runtime/ci-logs
          free -h > example/example_cluster/.runtime/ci-logs/memory.txt 2>&1 || true
          df -h > example/example_cluster/.runtime/ci-logs/disk.txt 2>&1 || true
          docker stats --no-stream > example/example_cluster/.runtime/ci-logs/docker-stats.txt 2>&1 || true
          docker ps -a > example/example_cluster/.runtime/ci-logs/docker-ps.txt 2>&1 || true
          docker compose -f example/example_cluster/docker-compose.yml logs --no-color > example/example_cluster/.runtime/ci-logs/business.log 2>&1 || true
          docker logs airflow-scheduler > example/example_cluster/.runtime/ci-logs/airflow-scheduler.log 2>&1 || true
          docker logs spark-master > example/example_cluster/.runtime/ci-logs/spark-master.log 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cluster-e2e-logs
          path: openrec/example/example_cluster/.runtime/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop cluster distribution
        if: always()
        working-directory: openrec
        run: ./example/example_cluster/stop.sh || true
