name: Quality

on:
  pull_request:
  push:
    branches: [master, 'release/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out distribution
        uses: actions/checkout@v7
        with:
          path: openrec/openrec

      - name: Set up Java 21 for all Java components
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check out manifest components
        working-directory: openrec/openrec
        env:
          OPENREC_COMPONENTS: bigdata-platform rec-server sdk rec-console rank-engine rec-algorithm data-processor
        run: ./scripts/release/checkout-components.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install feature parity test dependencies
        working-directory: openrec/rec-algorithm
        run: pip install pandas numpy pytest

      - name: Validate distribution policy and deployment definitions
        working-directory: openrec/openrec
        run: ./scripts/ci/validate.sh

      - name: Test Maven dependency retry handling
        working-directory: openrec/openrec
        run: python -m unittest discover -s scripts/tests -v

      - name: Verify rank model feature transport
        working-directory: openrec/openrec
        run: python scripts/ci/verify_rank_feature_contract.py

      - name: Verify SDK feature and event contracts
        working-directory: openrec/openrec
        run: python scripts/ci/verify_sdk_feature_contract.py

      - name: Build and test Java 21 components
        working-directory: openrec/openrec
        run: ./scripts/ci/build-components.sh

      - name: Verify Python, Flink, and Spark feature parity
        working-directory: openrec/openrec
        run: ./scripts/ci/verify-feature-parity.sh
