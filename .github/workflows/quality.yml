name: Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out distribution
        uses: actions/checkout@v7
        with:
          path: openrec/example

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Check out manifest components
        working-directory: openrec/example
        env:
          OPENREC_COMPONENTS: rec-server sdk rec-console rank-engine rec-algorithm data-processor
        run: ./scripts/checkout-components.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install feature parity test dependencies
        working-directory: openrec/rec-algorithm
        run: pip install pandas numpy pytest

      - name: Validate distribution policy and deployment definitions
        working-directory: openrec/example
        run: ./scripts/validate.sh

      - name: Build and test Java compatibility chain
        working-directory: openrec/example
        run: ./scripts/build-components.sh

      - name: Verify Python, Flink, and Spark feature parity
        working-directory: openrec/example
        run: ./scripts/verify-feature-parity.sh
