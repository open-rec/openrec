name: Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out distribution
        uses: actions/checkout@v4
        with:
          path: openrec/example

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Check out manifest components
        working-directory: openrec/example
        run: ./scripts/checkout-components.sh

      - name: Validate distribution policy and deployment definitions
        working-directory: openrec/example
        run: ./scripts/validate.sh

      - name: Build and test Java compatibility chain
        working-directory: openrec/example
        run: ./scripts/build-components.sh
