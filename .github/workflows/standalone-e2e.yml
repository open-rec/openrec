name: Standalone E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
  push:
    branches: [master, 'release/**']
    paths:
      - 'standalone/**'
      - 'init/**'
      - 'web/**'
      - 'data/test/**'
      - 'release/openrec.json'
      - 'scripts/**'
      - '.github/workflows/standalone-e2e.yml'

permissions:
  contents: read

concurrency:
  group: standalone-e2e
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Hosted runners use upstream registries instead of the local mirror defaults.
      PROMETHEUS_IMAGE: prom/prometheus:v3.5.0
      GRAFANA_IMAGE: grafana/grafana:12.1.0
      REDIS_EXPORTER_IMAGE: oliver006/redis_exporter:v1.77.0
      ELASTICSEARCH_EXPORTER_IMAGE: prometheuscommunity/elasticsearch-exporter:v1.9.0
      BLACKBOX_EXPORTER_IMAGE: prom/blackbox-exporter:v0.27.0
      RECOMMEND_DEADLINE_MS: '10000'
      OPENREC_GRAPH_NODE_TIMEOUT_MS: '1000'
    steps:
      - name: Check out distribution
        uses: actions/checkout@v7
        with:
          path: openrec/openrec

      - name: Set up Java 21 for all Java components
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check out manifest components
        working-directory: openrec/openrec
        run: ./scripts/release/checkout-components.sh

      - name: Start and verify the complete standalone distribution
        working-directory: openrec
        run: ./openrec/standalone/start.sh

      - name: Capture diagnostics
        if: failure()
        working-directory: openrec
        run: |
          docker ps -a
          docker compose -f openrec/standalone/docker-compose.yml logs --no-color > openrec/standalone/.runtime/compose.log 2>&1 || true
          bigdata-platform/platform.sh logs redis elasticsearch > openrec/standalone/.runtime/platform.log 2>&1 || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: standalone-e2e-logs
          path: openrec/openrec/standalone/.runtime/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop standalone distribution
        if: always()
        working-directory: openrec
        run: ./openrec/standalone/stop.sh --with-storage || true
