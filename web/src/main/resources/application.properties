server.port=8080

# rec-server, reached through rec-client
rec.server.endpoint=http://127.0.0.1:13579

# defaults the page starts with
demo.user-id=user_0
demo.scene=scene_0
demo.scenes=scene_0,scene_1,scene_2
demo.page-size=12

# Redis is read directly for the hot / new recall tables, for item details and for the
# behaviour counters: rec-server exposes no API for any of them.
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.timeout=3000

logging.level.com.openrec.example.web=INFO
