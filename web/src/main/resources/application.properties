server.port=12345

# rec-server, reached through rec-client
rec.server.endpoint=http://127.0.0.1:13579

# defaults the page starts with
demo.user-id=user_0
demo.scene=scene_0
demo.scenes=scene_0,scene_1,scene_2
demo.page-size=12
# server: standalone Collector/direct-table fallback; viewport: cluster browser-visible impressions
demo.exposure-mode=server

# Redis is read directly for the hot / new recall tables, for item details and for the
# behaviour counters: rec-server exposes no API for any of them.
spring.redis.host=127.0.0.1
spring.redis.port=6380
spring.redis.timeout=3000

# Serve the static assets uncached. Without this Spring Boot sends only Last-Modified, browsers fall
# back to heuristic caching, and an edited app.js keeps being served from cache — which looks like a
# missing feature rather than a stale file.
spring.resources.cache.cachecontrol.no-store=true

logging.level.com.openrec.example.web=INFO
